async function demoApi(action, b){
  await new Promise(r=>setTimeout(r, 350));
  const S = demoCfg(), now = new Date().toISOString().slice(0,16).replace('T',' ');
  const log = (act, ref, det) => S.audit.unshift({at:now, actor:S.me, action:act, ref, details:det||''});
  const pub = r => ({...r});
  switch(action){
    case 'config': return { ok:true, settings:S.settings, fields:S.fields.filter(f=>f.enabled) };
    case 'login': if (b.password!=='demo') return {ok:false,error:'INVALID'}; S.me = (b.email||S.me).toLowerCase(); return {ok:true, token:'demo-token', user:{email:S.me, name:'HR Demo User', role:'ADMIN', scope:'ALL'}};
    case 'logout': return {ok:true};
    case 'list': return b.token==='demo-token' ? {ok:true, rows:S.rows.map(pub), fields:S.fields, settings:S.settings, statuses:STATUSES, user:{email:S.me,name:'HR Demo User',role:'ADMIN',scope:'ALL'}, sheetUrl:''} : {ok:false,error:'AUTH'};
    case 'submit': case 'create': {
      const d = b.data;
      S.fields.forEach(f => { if (f.type==='text' && f.options?.length && d[f.key]){ const o = f.options.find(x => nk(x)===nk(d[f.key])); if (o) d[f.key] = o; } });   // same spelling unification as the server
      const ex = S.rows.find(r=>r.idNumber===d.idNumber);
      if (ex){ if (ex.hrCode!==d.hrCode) return {ok:false,error:'ID_EXISTS'}; if (action==='create') return {ok:false,error:'EMPLOYEE_EXISTS'}; Object.assign(ex,d,{status:'Updated',updatedAt:now, hasDoc: ex.hasDoc || !!b.doc}); log('SELF_UPDATE',ex.ref); return {ok:true,ref:ex.ref,updated:true}; }
      if (S.rows.some(r=>r.hrCode===d.hrCode)) return {ok:false,error:'HRCODE_EXISTS'};
      const ref = `GSC-26-${String(++S.seq).padStart(5,'0')}`;
      S.rows.unshift({...d, ref, submittedAt:now, updatedAt:now, status: action==='create'?'Verified':'New', hrNotes:'', verifiedBy: action==='create'?'HR Demo User':'', verifiedAt: action==='create'?now:'', submissions:'1', hasDoc: !!b.doc});
      log(action==='create'?'HR_CREATE':'SUBMIT', ref, d.fullName); return {ok:true, ref, updated:false};
    }
    case 'update': { const r = S.rows.find(x=>x.ref===b.ref); if (!r) return {ok:false,error:'NOT_FOUND'};
      const det = Object.keys(b.changes).map(k=>`${k}: "${r[k]||''}" → "${b.changes[k]}"`).join(' | ');
      Object.assign(r, b.changes, {updatedAt:now}); if (b.doc) r.hasDoc = true; if (b.changes.status==='Verified'){ r.verifiedBy='HR Demo User'; r.verifiedAt=now; }
      log('HR_EDIT', r.ref, det); return {ok:true, row:pub(r)}; }
    case 'delete': { const refs = b.refs||[]; S.rows = S.rows.filter(r=>!refs.includes(r.ref)); refs.forEach(x=>log('HR_DELETE',x)); return {ok:true, deleted:refs}; }
    case 'bulkStatus': { const done = []; S.rows.forEach(r => { if (b.refs.includes(r.ref) && r.status!==b.status){ r.status=b.status; r.updatedAt=now; if (b.status==='Verified'){ r.verifiedBy='HR Demo User'; r.verifiedAt=now; } done.push(r.ref); } }); log('HR_BULK_STATUS', done.join(', '), 'status → '+b.status); return {ok:true, updated:done}; }
    case 'history': return {ok:true, items: S.audit.filter(a=>String(a.ref).split(', ').includes(b.ref)).concat([{at:'2026-10-20 10:00', actor:'EMPLOYEE', action:'SUBMIT', details:''}])};
    case 'getDoc': { const c = document.createElement('canvas'); c.width=640; c.height=400; const x = c.getContext('2d'); x.fillStyle='#EAF0FB'; x.fillRect(0,0,640,400); x.fillStyle='#16408F'; x.font='bold 28px sans-serif'; x.fillText('Sample ID document', 40, 80); x.font='18px sans-serif'; x.fillText(b.ref, 40, 120);
      return {ok:true, name:b.ref+' - ID.jpg', mime:'image/jpeg', data:c.toDataURL('image/jpeg').split(',')[1]}; }
    case 'changePassword': return b.oldPassword==='demo' ? {ok:true} : {ok:false,error:'INVALID'};
    case 'getSettings': return {ok:true, settings:S.settings, fields:S.fields};
    case 'saveSettings': {
      const seen = {};
      for (const f of b.fields){ if (!String(f.label||'').trim()) return {ok:false,error:'FIELD_LABEL'}; const k = f.label.trim().toLowerCase(); if (seen[k]) return {ok:false,error:'FIELD_DUPLICATE',field:f.label}; seen[k]=1;
        if (f.type==='select' && !(f.options||[]).length) return {ok:false,error:'FIELD_OPTIONS',field:f.label}; }
      S.fields = b.fields.map(f => ({...f, key: f.key || ('c_'+f.label.toLowerCase().replace(/[^a-z0-9]+/g,'_')), isNew:undefined, builtin: !!f.builtin,
        enabled: LOCKED.includes(f.key) ? true : f.enabled !== false, required: LOCKED.includes(f.key) ? true : !!f.required }));
      S.settings = {...S.settings, ...b.settings, alertDays: +b.settings.alertDays || 60}; if (!S.settings.allowArabic) S.settings.defaultLang = 'en'; if (!S.settings.docUpload) S.settings.docRequired = false;
      return {ok:true, settings:S.settings, fields:S.fields};
    }
    case 'users': return {ok:true, users:S.users.map(u=>({...u})), businessUnits:['Green Sky Capital','SAFfly'], sheetUrl:''};
    case 'saveUser': { const u = b.user, em = String(u.email||'').toLowerCase(), ex = S.users.find(x=>x.email===em);
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return {ok:false,error:'BAD_EMAIL'}; if (!u.name) return {ok:false,error:'BAD_NAME'}; if (u.isNew && ex) return {ok:false,error:'USER_EXISTS'};
      const admins = S.users.filter(x=>x.role==='ADMIN'&&x.active&&x.email!==em).length;
      if (ex && ex.role==='ADMIN' && ex.active && (u.role!=='ADMIN'||!u.active) && !admins) return {ok:false,error:'LAST_ADMIN'};
      const sc = String(u.scope).split(','); const rec = {email:em,name:u.name,role:u.role,scope:sc.includes('ALL')?'ALL':sc.join(', '),active:u.active,pending:false,lastLogin:ex?ex.lastLogin:''};
      if (ex) Object.assign(ex, rec); else S.users.push(rec); return {ok:true, users:S.users.map(x=>({...x})), businessUnits:['Green Sky Capital','SAFfly']}; }
    case 'deleteUser': { const ex = S.users.find(x=>x.email===b.email); if (!ex) return {ok:false,error:'NOT_FOUND'};
      if (ex.role==='ADMIN' && ex.active && !S.users.filter(x=>x.role==='ADMIN'&&x.active&&x.email!==b.email).length) return {ok:false,error:'LAST_ADMIN'};
      S.users.splice(S.users.indexOf(ex),1); return {ok:true, users:S.users.map(x=>({...x})), businessUnits:['Green Sky Capital','SAFfly'], self:b.email===S.me}; }
  }
  return {ok:false,error:'UNKNOWN_ACTION'};
}
